<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custom Text Shape</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    height: 100%;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }

  /* ---- control panel ---- */
  #panel {
    width: 100%;
    max-width: 480px;
    background: #111;
    padding: 16px;
    border-bottom: 1px solid #333;
  }
  #panel label {
    display: block;
    color: #ffb6c1;
    font-size: 13px;
    font-weight: bold;
    margin: 10px 0 4px;
  }
  #panel select,
  #panel input[type="text"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #fff;
    font-size: 15px;
  }
  #panel button {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 20px;
    background: #ffb6c1;
    color: #222;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }
  #panel button:active { opacity: 0.8; }
  #panel button:disabled { opacity: 0.5; cursor: default; }

  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }

  /* ---- canvas area ---- */
  #canvasWrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 10px 0 40px;
  }
  canvas { display: block; }

  #replayBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: #ffb6c1;
    color: #222;
    border: none;
    border-radius: 20px;
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    cursor: pointer;
  }
  #replayBtn.show { opacity: 1; pointer-events: auto; }

  #progressWrap {
    width: 100%;
    height: 6px;
    background: #222;
    border-radius: 3px;
    margin-top: 10px;
    overflow: hidden;
    display: none;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: #ffb6c1;
    transition: width 0.15s;
  }
</style>
</head>
<body>

<div id="panel">
  <label for="shapeSelect">Shape</label>
  <select id="shapeSelect">
    <option value="heart">Heart</option>
    <option value="infinity" selected>Infinity</option>
    <option value="paw">Cat Paw</option>
    <option value="star">Star</option>
  </select>

  <label for="headingInput">Static heading text</label>
  <input id="headingInput" type="text" value="Happy Friendship Day!" maxlength="60" />

  <label for="wordInput">Animation text (repeats to fill the shape)</label>
  <input id="wordInput" type="text" value="Kutti" maxlength="20" />

  <div class="row">
    <div>
      <label for="colorInput">Text color</label>
      <input id="colorInput" type="color" value="#ffb6c1" />
    </div>
    <div>
      <label for="speedInput">Speed</label>
      <select id="speedInput">
        <option value="1">Fast</option>
        <option value="2" selected>Medium</option>
        <option value="4">Slow</option>
      </select>
    </div>
  </div>

  <button id="generateBtn">Generate</button>
  <button id="downloadBtn" style="background:#333; color:#ffb6c1; margin-top:8px;">Download as GIF</button>
  <div id="progressWrap"><div id="progressBar"></div></div>
  <div id="recordStatus" style="color:#999; font-size:12px; margin-top:8px; text-align:center;"></div>
</div>

<div id="canvasWrap">
  <canvas id="canvas"></canvas>
</div>
<button id="replayBtn">Replay</button>

function makeWorkerBlobUrl() {
  const binary = atob(GIF_WORKER_B64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const blob = new Blob([bytes], { type: "application/javascript" });
  return URL.createObjectURL(blob);
}

// ---------------- shape point generators ----------------
function heartPoints() {
  const pts = [];
  for (let scale = 11; scale < 17; scale++) {
    for (let i = 0; i < 120; i++) {
      const angle = i * (Math.PI * 2) / 120;
      const x = 16 * Math.pow(Math.sin(angle), 3) * scale;
      const y = (13 * Math.cos(angle) - 5 * Math.cos(2*angle) - 2 * Math.cos(3*angle) - Math.cos(4*angle)) * scale;
      pts.push([x, y]);
    }
  }
  return pts;
}

function infinityPoints() {
  const pts = [];
  const A = 160, layers = 5, pointsPerLayer = 55;
  for (let layer = 0; layer < layers; layer++) {
    const scale = 0.72 + (layer / (layers - 1)) * 0.28;
    for (let i = 0; i < pointsPerLayer; i++) {
      const t = i * (2 * Math.PI) / pointsPerLayer;
      const denom = 1 + Math.sin(t) ** 2;
      const x = A * scale * Math.cos(t) / denom;
      const y = A * scale * Math.sin(t) * Math.cos(t) / denom;
      pts.push([x, y]);
    }
  }
  return pts;
}

function pawPoints() {
  const pts = [];
  const blobs = [
    [0,   -60, 65, 50, 6, 22],
    [-55,  35, 26, 26, 4, 14],
    [-20,  58, 28, 28, 4, 14],
    [20,   58, 28, 28, 4, 14],
    [55,   35, 26, 26, 4, 14],
  ];
  for (const [cx, cy, rx, ry, rings, pointsPerRing] of blobs) {
    for (let r = 1; r <= rings; r++) {
      const fraction = r / rings;
      for (let i = 0; i < pointsPerRing; i++) {
        const angle = i * (2 * Math.PI) / pointsPerRing;
        const x = cx + rx * fraction * Math.cos(angle);
        const y = cy + ry * fraction * Math.sin(angle);
        pts.push([x, y]);
      }
    }
  }
  return pts;
}

function starPoints() {
  const pts = [];
  const spikes = 5;
  const outerR = 140, innerR = 55;
  const rings = 6, pointsPerRing = 70;
  const verts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const r = (i % 2 === 0) ? outerR : innerR;
    const angle = (Math.PI / spikes) * i - Math.PI / 2;
    verts.push([r * Math.cos(angle), r * Math.sin(angle)]);
  }
  for (let layer = 0; layer < rings; layer++) {
    const scale = 0.3 + (layer / (rings - 1)) * 0.7;
    for (let i = 0; i < pointsPerRing; i++) {
      const t = (i / pointsPerRing) * verts.length;
      const idx = Math.floor(t) % verts.length;
      const nextIdx = (idx + 1) % verts.length;
      const frac = t - Math.floor(t);
      const x = (verts[idx][0] + (verts[nextIdx][0] - verts[idx][0]) * frac) * scale;
      const y = (verts[idx][1] + (verts[nextIdx][1] - verts[idx][1]) * frac) * scale;
      pts.push([x, y]);
    }
  }
  return pts;
}

const shapeGenerators = {
  heart: heartPoints,
  infinity: infinityPoints,
  paw: pawPoints,
  star: starPoints,
};

// ---------------- shared layout computation ----------------
// Used by both the live on-screen animation and the GIF export, so they
// always match exactly.
function computeLayout(targetWidth, targetHeight) {
  const WORD = wordInput.value.trim() || "Kutti";
  const HEADING = headingInput.value.trim();
  const COLOR = colorInput.value;
  const shapeKey = shapeSelect.value;
  const points = shapeGenerators[shapeKey]();

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of points) {
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  const HEADING_SPACE = HEADING ? 55 : 10;
  maxY += HEADING_SPACE;

  const shapeWidth = maxX - minX;
  const shapeHeight = maxY - minY;
  const shapeCenterX = (minX + maxX) / 2;
  const shapeCenterY = (minY + maxY) / 2;

  const size = Math.min(targetWidth, targetHeight);
  const padding = 0.85;
  const scaleFactor = Math.min(
    targetWidth / shapeWidth,
    targetHeight / shapeHeight
  ) * padding;

  const originX = targetWidth / 2;
  const originY = targetHeight / 2;
  const fontSize = Math.max(10, size * 0.032);

  return { WORD, HEADING, COLOR, points, shapeCenterX, shapeCenterY, maxY,
           scaleFactor, originX, originY, fontSize };
}

function renderFrame(targetCtx, layout, pointCount) {
  const { WORD, HEADING, COLOR, points, shapeCenterX, shapeCenterY, maxY,
          scaleFactor, originX, originY, fontSize } = layout;
  const w = targetCtx.canvas.width, h = targetCtx.canvas.height;

  targetCtx.setTransform(1, 0, 0, 1, 0, 0);
  targetCtx.fillStyle = "#000";
  targetCtx.fillRect(0, 0, w, h);

  targetCtx.fillStyle = COLOR;
  targetCtx.textAlign = "center";
  targetCtx.textBaseline = "middle";

  if (HEADING) {
    const headingY = originY - (maxY - shapeCenterY) * scaleFactor + fontSize * 0.5;
    targetCtx.font = `bold ${fontSize * 1.6}px Arial`;
    targetCtx.fillText(HEADING, originX, headingY);
  }
  targetCtx.font = `bold ${fontSize}px Arial`;

  const n = Math.min(pointCount, points.length);
  for (let i = 0; i < n; i++) {
    const [x, y] = points[i];
    const px = originX + (x - shapeCenterX) * scaleFactor;
    const py = originY - (y - shapeCenterY) * scaleFactor;
    targetCtx.fillText(WORD, px, py);
  }
}

// ---------------- live on-screen animation ----------------
let currentAnimFrame = null;

function resizeCanvas() {
  const availW = Math.min(window.innerWidth * 0.92, 700);
  const availH = window.innerHeight * 0.62;
  canvas.width = availW;
  canvas.height = availH;
}
resizeCanvas();

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { resizeCanvas(); draw(); }, 150);
});

function draw() {
  if (currentAnimFrame) cancelAnimationFrame(currentAnimFrame);
  replayBtn.classList.remove('show');

  const layout = computeLayout(canvas.width, canvas.height);
  const framesToWait = parseInt(speedInput.value, 10);

  let i = 0;
  let frameCount = 0;

  function step() {
    frameCount++;
    if (frameCount >= framesToWait) {
      frameCount = 0;
      i++;
      renderFrame(ctx, layout, i);
    }
    if (i < layout.points.length) {
      currentAnimFrame = requestAnimationFrame(step);
    } else {
      replayBtn.classList.add('show');
    }
  }
  renderFrame(ctx, layout, 0);
  currentAnimFrame = requestAnimationFrame(step);
}

generateBtn.addEventListener('click', draw);
replayBtn.addEventListener('click', draw);

// ---------------- GIF export ----------------
// Frames are computed synchronously/programmatically rather than captured
// live, so this doesn't depend on real-time playback, tab visibility, or
// mobile browser recording quirks - it just computes the file.
downloadBtn.addEventListener('click', () => {
  if (typeof GIF === "undefined") {
    recordStatus.textContent = "GIF export isn't available in this file.";
    return;
  }

  downloadBtn.disabled = true;
  generateBtn.disabled = true;
  progressWrap.style.display = "block";
  progressBar.style.width = "0%";
  recordStatus.textContent = "Building GIF...";

  function resetUI() {
    downloadBtn.disabled = false;
    generateBtn.disabled = false;
    progressWrap.style.display = "none";
  }

  try {
    // Fixed export size keeps file size/time predictable regardless of
    // the viewer's current window size.
    const EXPORT_W = 600, EXPORT_H = 600;
    const offCanvas = document.createElement('canvas');
    offCanvas.width = EXPORT_W;
    offCanvas.height = EXPORT_H;
    const offCtx = offCanvas.getContext('2d');

    const layout = computeLayout(EXPORT_W, EXPORT_H);
    const totalPoints = layout.points.length;
    const framesToWait = parseInt(speedInput.value, 10); // matches the on-screen Speed setting

    // Match the perceived speed of the live animation: on screen, one point
    // is drawn every `framesToWait` animation frames at ~60fps.
    const msPerPoint = framesToWait * (1000 / 60);

    const MAX_FRAMES = 200;   // cap frame count for reasonable file size/encode time
    const HOLD_FRAMES = 8;    // repeated frames at the end so it pauses on the finished shape
    const HOLD_DELAY_MS = 250;

    const step = Math.max(1, Math.ceil(totalPoints / MAX_FRAMES));
    const FRAME_DELAY_MS = Math.max(20, Math.round(step * msPerPoint));

    const gif = new GIF({
      workers: 2,
      quality: 10,
      width: EXPORT_W,
      height: EXPORT_H,
      workerScript: makeWorkerBlobUrl(),
      background: "#000",
    });

    for (let count = step; count < totalPoints; count += step) {
      renderFrame(offCtx, layout, count);
      gif.addFrame(offCtx, { copy: true, delay: FRAME_DELAY_MS });
    }
    // final full frame, held for a bit longer
    renderFrame(offCtx, layout, totalPoints);
    for (let h = 0; h < HOLD_FRAMES; h++) {
      gif.addFrame(offCtx, { copy: true, delay: HOLD_DELAY_MS });
    }

    gif.on('progress', (p) => {
      progressBar.style.width = Math.round(p * 100) + "%";
    });

    gif.on('finished', (blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "text-shape-animation.gif";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 2000);

      recordStatus.textContent = "Downloaded!";
      setTimeout(() => { recordStatus.textContent = ""; }, 3000);
      resetUI();
    });

    gif.on('abort', () => {
      recordStatus.textContent = "GIF creation was aborted.";
      resetUI();
    });

    gif.render();

  } catch (err) {
    recordStatus.textContent = "Couldn't create the GIF: " + err.message;
    resetUI();
  }
});

draw();
</script>
</body>
</html>
